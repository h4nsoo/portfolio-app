<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Mohamed Belgacem's portfolio - A passionate full-stack developer specializing in React, Node.js, and modern web technologies. View my projects and experience in web development."
    />
    <meta
      name="keywords"
      content="Mohamed Belgacem, Web Developer, Full Stack Developer, React Developer, Portfolio, JavaScript, Node.js"
    />
    <meta name="author" content="Mohamed Belgacem" />

    <!-- Open Graph Meta Tags for Social Media -->
    <meta
      property="og:title"
      content="Mohamed Belgacem - Full Stack Developer Portfolio"
    />
    <meta
      property="og:description"
      content="Explore my portfolio showcasing web development projects built with React, Node.js, and modern technologies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medbelgacem.tech" />
    <meta
      property="og:image"
      content="https://medbelgacem.tech/portfolio-preview.png"
    />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mohamed Belgacem - Full Stack Developer Portfolio"
    />
    <meta
      name="twitter:description"
      content="Explore my portfolio showcasing web development projects built with React, Node.js, and modern technologies."
    />
    <meta
      name="twitter:image"
      content="https://medbelgacem.tech/portfolio-preview.png"
    />

    <title>Mohamed Belgacem Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
